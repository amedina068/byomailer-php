name: Bug report
description: Report a fault in the PHP SDK.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste a token, a webhook secret or another secret in this form.
        To report a security problem, read SECURITY.md. Do not use this form.
  - type: textarea
    id: what-occurred
    attributes:
      label: What occurred
      description: Write what the SDK did. Give the exception class and its message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Write what the SDK must do.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code
      description: Give the smallest code that shows the fault.
      render: php
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: byomailer-version
    attributes:
      label: BYOMailer version or commit
      description: Give the version or the commit of your BYOMailer instance, if you know it.
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3.14"
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      description: If you use the Laravel integration, give the Laravel version.
      placeholder: "12.40"
  - type: input
    id: http-client
    attributes:
      label: HTTP client
      placeholder: Guzzle 7.9
